name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Runs after Build, not before: `LayoutProps<"/">` and other typed-route
      # helpers come from ambient types Next.js generates under .next/types/
      # during build/dev — on a fresh checkout those don't exist yet, so this
      # step fails with "Cannot find name 'LayoutProps'" if run earlier, even
      # though there's no real type error (next build's own TypeScript pass
      # already gates on real errors; this is a fast, explicit sanity check
      # on top of that, not the source of truth).
      - name: Type-check
        run: npx tsc --noEmit
